[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "commerce-service"
version = "0.1.0"
description = "Commerce Inventory & Order API"
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.109.0",
    "pydantic==2.6.0",
    "uvicorn==0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.4",
    "pytest-asyncio==0.23.0",
    "httpx==0.26.0",
]
