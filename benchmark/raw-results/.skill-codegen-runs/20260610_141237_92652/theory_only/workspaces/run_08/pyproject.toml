[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "commerce-service"
version = "0.1.0"
description = "Commerce Inventory & Order API"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.104.1",
    "pydantic==2.5.0",
    "uvicorn==0.24.0",
    "python-dotenv==1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "httpx==0.25.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
