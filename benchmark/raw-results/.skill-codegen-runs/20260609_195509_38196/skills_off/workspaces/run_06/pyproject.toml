[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commerce-service"
version = "0.1.0"
description = "Inventory reservation and order orchestration API"
dependencies = [
    "fastapi==0.115.4",
    "pydantic==2.9.2",
    "uvicorn==0.32.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
