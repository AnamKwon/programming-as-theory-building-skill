[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commerce-service"
version = "0.1.0"
description = "Inventory reservation and order orchestration API"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "sqlalchemy==2.0.23",
]

[project.optional-dependencies]
test = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "httpx==0.25.2",
]
dev = [
    "black==23.12.0",
    "ruff==0.1.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
select = ["E", "F", "W"]

[tool.black]
line-length = 100
