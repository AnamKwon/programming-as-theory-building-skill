[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commerce-service"
version = "0.1.0"
description = "Inventory reservation and order orchestration API"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.112.1",
    "pydantic==2.7.1",
    "sqlalchemy==2.0.27",
    "uvicorn==0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.4",
    "pytest-asyncio==0.23.3",
    "httpx==0.26.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
