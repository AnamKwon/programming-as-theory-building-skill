[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commerce-service"
version = "0.1.0"
description = "Inventory reservation and order orchestration API"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.109.0",
    "pydantic==2.6.1",
    "sqlalchemy==2.0.27",
    "uvicorn==0.27.0",
    "python-dotenv==1.0.0",
]
dev-dependencies = [
    "pytest==7.4.4",
    "pytest-asyncio==0.23.2",
    "httpx==0.25.2",
]

[tool.hatch.envs.default]
dependencies = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
